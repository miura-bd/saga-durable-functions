<svg xmlns="http://www.w3.org/2000/svg" width="920" height="614" viewBox="0 0 920 614" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="920" height="614" fill="#ffffff"/>
  <text x="460" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#16191f">ライブ配信 SAGA：正常系のステップと中止時の補償</text>

  <!-- column headers -->
  <text x="220" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1a73e8">正常系（上から順に前進）</text>
  <text x="460" y="80" font-size="11" text-anchor="middle" fill="#5f6368">成功したら</text>
  <text x="460" y="94" font-size="11" text-anchor="middle" fill="#5f6368">補償を登録</text>
  <text x="700" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#d93025">中止時の補償（下から上へ逆順）</text>

  <!-- forward steps (left column) -->
  <g font-size="13" fill="#16191f">
    <rect x="40" y="108" width="360" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="60" y="129">1. 配信リソースを確保する</text>
    <text x="60" y="147" font-size="11" fill="#5f6368">reserve_streaming</text>

    <rect x="40" y="180" width="360" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="60" y="201">2. 購入者向けの視聴ページを公開する</text>
    <text x="60" y="219" font-size="11" fill="#5f6368">open_viewing_page</text>

    <rect x="40" y="252" width="360" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="60" y="273">3. 外部の配信先へ「配信します」と連絡する</text>
    <text x="60" y="291" font-size="11" fill="#5f6368">notify_partners</text>

    <rect x="40" y="324" width="360" height="48" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="60" y="345">4. 開催可否の判断を待つ</text>
    <text x="60" y="363" font-size="11" fill="#5f6368">主催者のコールバック or 開演時刻</text>

    <rect x="40" y="396" width="360" height="48" rx="8" fill="#e6f4ea" stroke="#188038"/>
    <text x="60" y="417">5. 配信を開始する（ピボット）</text>
    <text x="60" y="435" font-size="11" fill="#5f6368">start_streaming</text>
  </g>
  <g stroke="#1a73e8" stroke-width="2" marker-end="url(#ar)">
    <line x1="220" y1="156" x2="220" y2="178"/>
    <line x1="220" y1="228" x2="220" y2="250"/>
    <line x1="220" y1="300" x2="220" y2="322"/>
    <line x1="220" y1="372" x2="220" y2="394"/>
  </g>
  <text x="232" y="388" font-size="10" fill="#188038">開催なら</text>

  <!-- registration links (dotted) -->
  <g stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="400" y1="132" x2="520" y2="132"/>
    <line x1="400" y1="204" x2="520" y2="204"/>
    <line x1="400" y1="276" x2="520" y2="276"/>
  </g>

  <!-- compensations (right column) -->
  <g font-size="13" fill="#16191f">
    <rect x="520" y="108" width="360" height="48" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="540" y="129">③ 配信リソースを解放する</text>
    <text x="540" y="147" font-size="11" fill="#5f6368">compensate_reserve_streaming</text>

    <rect x="520" y="180" width="360" height="48" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="540" y="201">② 視聴ページを閉じる</text>
    <text x="540" y="219" font-size="11" fill="#5f6368">compensate_open_viewing_page</text>

    <rect x="520" y="252" width="360" height="48" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="540" y="273">① 外部の配信先へ「中止します」と連絡する</text>
    <text x="540" y="291" font-size="11" fill="#5f6368">compensate_notify_partners</text>

    <rect x="520" y="324" width="360" height="48" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-dasharray="4 3"/>
    <text x="540" y="345">まず販売を止めて中止表示にしたことを記録</text>
    <text x="540" y="363" font-size="11" fill="#5f6368">record_cancellation（補償の前に行う）</text>

    <text x="540" y="425" font-size="12" fill="#5f6368">補償なし（ピボット以降は戻さない）</text>
  </g>
  <g stroke="#d93025" stroke-width="2" marker-end="url(#arr)">
    <line x1="700" y1="324" x2="700" y2="302"/>
    <line x1="700" y1="252" x2="700" y2="230"/>
    <line x1="700" y1="180" x2="700" y2="158"/>
  </g>

  <!-- cancel trigger -->
  <line x1="400" y1="348" x2="518" y2="348" stroke="#d93025" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="460" y="340" font-size="11" text-anchor="middle" fill="#d93025">中止なら</text>

  <rect x="40" y="466" width="840" height="124" rx="10" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="60" y="492" font-size="14" font-weight="700" fill="#16191f">補償スタックの考え方（このサンプルの実装）</text>
  <g font-size="13" fill="#3c4043">
    <text x="60" y="518">・1〜3 が成功するたびに、右の補償を配列（スタック）に push する。</text>
    <text x="60" y="542">・中止が決まったら、販売停止を記録し、スタックを <tspan font-weight="700">逆順</tspan>（① → ② → ③）に実行する。</text>
    <text x="60" y="566">・1〜3 の途中で失敗したときは中止にせず、販売を止めて当日の操作だけを戻し、人に任せる。</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a73e8"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d93025"/></marker>
  </defs>
</svg>
